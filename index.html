<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#141428" />
    <title>Мультяшные гонки</title>
    <style>
      html, body { touch-action: none; overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div id="hud" class="hidden">
        <div class="hud-panel left">
          <div class="stat"><span class="label">Здоровье</span><div class="bar"><div id="health-bar" class="fill health"></div></div><span id="health-val">100</span></div>
          <div class="stat"><span class="label">Броня</span><div class="bar"><div id="armor-bar" class="fill armor"></div></div><span id="armor-val">0</span></div>
          <div class="stat"><span class="label">Оружие</span><span id="weapon-val" class="value">—</span></div>
          <div class="stat"><span class="label">Ускорение</span><span id="boost-val" class="value">0</span></div>
          <div class="stat"><span class="label">Разрушения</span><span id="dest-val" class="value">0</span></div>
        </div>
        <div class="hud-panel right">
          <div class="stat"><span class="label">Круг</span><span id="lap-val" class="value">1 / 3</span></div>
          <div class="stat"><span class="label">Время</span><span id="time-val" class="value">0:00</span></div>
          <div class="stat"><span class="label">Место</span><span id="place-val" class="value">1</span></div>
        </div>
        <div id="message" class="message hidden"></div>
        <div id="controls-hint" class="controls-hint">
          <strong>Клавиатура (ПК)</strong>
          <span>WASD / стрелки — езда</span>
          <span>Space / Shift — ускорение</span>
          <span>ЛКМ / F — стрельба</span>
          <span>R — респаун · P — пауза</span>
        </div>
      </div>

      <button id="mute-btn" class="hidden" type="button" aria-label="Звук" title="Звук">🔊</button>
      <button id="pause-btn" class="hidden" type="button" aria-label="Пауза" title="Пауза">⏸</button>

      <div id="touch-controls" aria-hidden="true">
        <div class="touch-left">
          <div id="joystick" class="joystick" data-control="joystick">
            <div id="joystick-knob" class="joystick-knob"></div>
            <span class="joy-label">РУЛЬ</span>
          </div>
          <div class="steer-pads">
            <button type="button" id="btn-steer-left" class="touch-btn steer" data-control="left" aria-label="Влево">◀</button>
            <button type="button" id="btn-steer-right" class="touch-btn steer" data-control="right" aria-label="Вправо">▶</button>
          </div>
        </div>
        <div class="touch-right">
          <button type="button" id="btn-fire" class="touch-btn action fire" data-control="fire" aria-label="Огонь">🔥</button>
          <button type="button" id="btn-boost" class="touch-btn action boost" data-control="boost" aria-label="Ускорение">⚡</button>
          <button type="button" id="btn-gas" class="touch-btn action gas" data-control="gas" aria-label="Газ">▲ ГАЗ</button>
          <button type="button" id="btn-brake" class="touch-btn action brake" data-control="brake" aria-label="Тормоз">▼ ТОРМ</button>
          <button type="button" id="btn-respawn" class="touch-btn action respawn" data-control="respawn" aria-label="Респаун">↺</button>
        </div>
      </div>

      <div id="pause-overlay" class="overlay hidden">
        <h2>Пауза</h2>
        <p>Нажмите, чтобы продолжить</p>
        <button id="resume-btn" type="button">ПРОДОЛЖИТЬ</button>
        <button id="quit-btn" type="button" class="quit-btn">В МЕНЮ</button>
      </div>

      <div id="results-screen" class="overlay hidden">
        <h2 id="results-title">Финиш!</h2>
        <p id="results-time" class="results-time"></p>
        <div id="results-body" class="results-body"></div>
        <button id="again-btn" type="button">В МЕНЮ</button>
      </div>

      <div id="menu-root"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
